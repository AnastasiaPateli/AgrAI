<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Έλεγχος Συνδεδεμένης Ενίσχυσης</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #0055aa; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h1>Έλεγχος Συνδεδεμένης Ενίσχυσης</h1>
    <p>Ανεβάστε το αρχείο δεδομένων (CSV) για έλεγχο:</p>
    <input type="file" id="fileInput">
    
    <table id="resultTable">
        <thead>
            <tr>
                <th>Α/Α Αγροτεμαχίου</th>
                <th>Καλλιέργεια</th>
                <th>Συνδεδεμένη Ενίσχυση</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        const reader = new FileReader();

        reader.onload = function(e) {
            const lines = e.target.result.split('\n');
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = ''; // Καθαρισμός πίνακα

            lines.forEach(line => {
                const [aa, code, syndedemeni] = line.split(',');
                if (['1', '3.1', '12'].includes(code)) {
                    const row = `<tr>
                        <td>${aa}</td>
                        <td>${code}</td>
                        <td>${syndedemeni}</td>
                    </tr>`;
                    tbody.innerHTML += row;
                }
            });
        };
        reader.readAsText(file);
    });
</script>

</body>
</html>
